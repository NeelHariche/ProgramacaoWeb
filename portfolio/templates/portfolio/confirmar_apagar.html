{% extends 'portfolio/base.html' %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<h2>{{ titulo }}</h2>

<p>Tens a certeza que queres apagar <strong>{{ objeto }}</strong>?</p>
<p>Esta ação não pode ser desfeita.</p>

<form method="post">
    {% csrf_token %}
    <p>
        <button type="submit">Sim, apagar</button>
        <a href="{{ voltar }}">Cancelar</a>
    </p>
</form>

{% endblock %}
