{% extends 'portfolio/base.html' %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<h2>{{ titulo }}</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <p>
        <button type="submit">Guardar</button>
        <a href="{{ voltar }}">Cancelar</a>
    </p>
</form>

{% endblock %}
