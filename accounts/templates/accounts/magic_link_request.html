{% extends 'portfolio/base.html' %}
{% block title %}Link Mágico{% endblock %}

{% block content %}
<h2>Link Mágico</h2>

<p>Insere o teu email e receberás um link para entrar sem password.</p>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    <p>
        <label>Email:</label><br>
        <input type="email" name="email" required autofocus>
    </p>
    <p>
        <button type="submit">Enviar link</button>
        <a href="{% url 'accounts:login' %}">Voltar</a>
    </p>
</form>

{% endblock %}
